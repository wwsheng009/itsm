<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1328 984" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
    <marker id="arS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/></marker>
  </defs>
  <rect x="0" y="0" width="1328" height="984" rx="14" fill="#ffffff"/>

  <!-- 使用者 -->
  <rect x="64" y="16" width="384" height="62" rx="10" fill="#f8fbff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="256" y="45" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">👤 客户方</text>
  <text x="256" y="65" text-anchor="middle" font-size="12.5" fill="#64748b">租户 A / B / C · 数据互相隔离</text>
  <rect x="472" y="16" width="384" height="62" rx="10" fill="#faf9ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="664" y="45" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">🛠️ 服务商</text>
  <text x="664" y="65" text-anchor="middle" font-size="12.5" fill="#64748b">provider 租户 · 跨客户服务</text>
  <rect x="880" y="16" width="384" height="62" rx="10" fill="#f5feff" stroke="#a5f3fc" stroke-width="1.5"/>
  <text x="1072" y="45" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">⚙️ 平台运维</text>
  <text x="1072" y="65" text-anchor="middle" font-size="12.5" fill="#64748b">平台面 · 开通与治理</text>

  <line x1="256" y1="78" x2="256" y2="112" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="664" y1="78" x2="664" y2="112" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="1072" y1="78" x2="1072" y2="112" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 统一入口 -->
  <rect x="64" y="116" width="1200" height="52" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="664" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">统一入口 · 登录认证 → 识别「身份 + 所属客户」</text>
  <text x="664" y="158" text-anchor="middle" font-size="12" fill="#64748b">服务商可切换被分配客户 · 平台操作双重门禁 · 识别不到即拒绝</text>

  <line x1="664" y1="168" x2="664" y2="199" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arB)"/>
  <text x="678" y="190" font-size="11.5" fill="#3b82f6">请求</text>

  <!-- 应用服务层 -->
  <rect x="64" y="204" width="1200" height="180" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="84" y="230" font-size="13.5" font-weight="700" fill="#475569">应用服务层 · 一套程序，多客户共用</text>
  <rect x="84" y="242" width="368" height="86" rx="10" fill="#f8fbff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="268" y="277" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">客户侧</text>
  <text x="268" y="301" text-anchor="middle" font-size="12.5" fill="#64748b">工单 · 知识库 · CMDB · 服务目录</text>
  <rect x="480" y="242" width="368" height="86" rx="10" fill="#faf9ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="664" y="277" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">服务商跨客户</text>
  <text x="664" y="301" text-anchor="middle" font-size="12.5" fill="#64748b">工作台 · 派单 · 评论互通 · 通知</text>
  <rect x="876" y="242" width="368" height="86" rx="10" fill="#f5feff" stroke="#a5f3fc" stroke-width="1.5"/>
  <text x="1060" y="277" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">平台治理</text>
  <text x="1060" y="301" text-anchor="middle" font-size="12.5" fill="#64748b">开通 · 租户用户 · 权限 · 审计</text>
  <rect x="84" y="344" width="1160" height="30" rx="8" fill="#fffdf3" stroke="#fde68a" stroke-width="1.2"/>
  <text x="664" y="364" text-anchor="middle" font-size="12.5" fill="#92400e">公共能力：权限引擎 · 分配关系 · 审计留痕 · 通知 · 生命周期</text>

  <line x1="664" y1="384" x2="664" y2="425" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arB)"/>
  <text x="678" y="410" font-size="11.5" fill="#3b82f6">所有请求</text>

  <!-- 安全防线 -->
  <rect x="280" y="430" width="768" height="272" rx="12" fill="#fff7f8" stroke="#fecdd3" stroke-width="1.5"/>
  <text x="664" y="458" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9f1239">安全防线 · 层层拦截，越权必拒</text>

  <rect x="304" y="470" width="720" height="46" rx="9" fill="#ffffff" stroke="#fda4af" stroke-width="1.5"/>
  <circle cx="332" cy="493" r="11" fill="#e11d48"/>
  <text x="332" y="497.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="356" y="498" font-size="13.5" font-weight="700" fill="#881337">请求层 · 认身份</text>
  <text x="1004" y="498" text-anchor="end" font-size="12" fill="#9f1239">识别不到即拒绝</text>

  <line x1="664" y1="516" x2="664" y2="526" stroke="#fb7185" stroke-width="1.6" marker-end="url(#arR)"/>

  <rect x="304" y="528" width="720" height="46" rx="9" fill="#ffffff" stroke="#fda4af" stroke-width="1.5"/>
  <circle cx="332" cy="551" r="11" fill="#e11d48"/>
  <text x="332" y="555.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="356" y="556" font-size="13.5" font-weight="700" fill="#881337">应用层 · 圈范围</text>
  <text x="1004" y="556" text-anchor="end" font-size="12" fill="#9f1239">按客户收窄数据</text>

  <line x1="664" y1="574" x2="664" y2="584" stroke="#fb7185" stroke-width="1.6" marker-end="url(#arR)"/>

  <rect x="304" y="586" width="720" height="46" rx="9" fill="#ffffff" stroke="#fda4af" stroke-width="1.5"/>
  <circle cx="332" cy="609" r="11" fill="#e11d48"/>
  <text x="332" y="613.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="356" y="614" font-size="13.5" font-weight="700" fill="#881337">治理层 · 上架审查</text>
  <text x="1004" y="614" text-anchor="end" font-size="12" fill="#9f1239">未登记不放行</text>

  <line x1="664" y1="632" x2="664" y2="642" stroke="#fb7185" stroke-width="1.6" marker-end="url(#arR)"/>

  <rect x="304" y="644" width="720" height="46" rx="9" fill="#ffffff" stroke="#fda4af" stroke-width="1.5"/>
  <circle cx="332" cy="667" r="11" fill="#e11d48"/>
  <text x="332" y="671.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <text x="356" y="672" font-size="13.5" font-weight="700" fill="#881337">数据库层 · 隔离锁</text>
  <text x="1004" y="672" text-anchor="end" font-size="12" fill="#9f1239">强制隔离 + 告警</text>

  <line x1="664" y1="702" x2="664" y2="733" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arB)"/>

  <!-- 数据底座 -->
  <rect x="280" y="738" width="768" height="116" rx="12" fill="#f2fdf8" stroke="#a7f3d0" stroke-width="2"/>
  <text x="304" y="766" font-size="13.5" font-weight="700" fill="#065f46">🗄️ 共享数据库（一套实例）</text>
  <rect x="304" y="776" width="356" height="44" rx="9" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="482" y="797" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">客户数据 · 150 张表</text>
  <text x="482" y="813" text-anchor="middle" font-size="11.5" fill="#64748b">启用租户隔离锁</text>
  <rect x="676" y="776" width="356" height="44" rx="9" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="854" y="797" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">平台级共享表 · 3 张</text>
  <text x="854" y="813" text-anchor="middle" font-size="11.5" fill="#64748b">按规则登记豁免</text>
  <text x="664" y="840" text-anchor="middle" font-size="12" fill="#047857">隔离状态监控 · 跨客户访问全部留痕</text>

  <!-- 两条链路 -->
  <text x="64" y="898" font-size="12.5" font-weight="700" fill="#334155">服务商跨客户授权 · 全过才放行</text>
  <rect x="64" y="906" width="118" height="36" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
  <text x="123" y="929" text-anchor="middle" font-size="12" font-weight="700" fill="#4338ca">① 身份</text>
  <line x1="182" y1="924" x2="206" y2="924" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arS)"/>
  <rect x="208" y="906" width="118" height="36" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
  <text x="267" y="929" text-anchor="middle" font-size="12" font-weight="700" fill="#4338ca">② 权限</text>
  <line x1="326" y1="924" x2="350" y2="924" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arS)"/>
  <rect x="352" y="906" width="118" height="36" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
  <text x="411" y="929" text-anchor="middle" font-size="12" font-weight="700" fill="#4338ca">③ 分配</text>
  <line x1="470" y1="924" x2="494" y2="924" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arS)"/>
  <rect x="496" y="906" width="118" height="36" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
  <text x="555" y="929" text-anchor="middle" font-size="12" font-weight="700" fill="#4338ca">④ 放行</text>

  <text x="712" y="898" font-size="12.5" font-weight="700" fill="#334155">一张工单的旅程 · 自动流转</text>
  <rect x="712" y="906" width="118" height="36" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="771" y="929" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">客户报单</text>
  <line x1="830" y1="924" x2="854" y2="924" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arS)"/>
  <rect x="856" y="906" width="118" height="36" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="915" y="929" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">自动派单</text>
  <line x1="974" y1="924" x2="998" y2="924" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arS)"/>
  <rect x="1000" y="906" width="118" height="36" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="1059" y="929" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">服务商处理</text>
  <line x1="1118" y1="924" x2="1142" y2="924" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arS)"/>
  <rect x="1144" y="906" width="118" height="36" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="1203" y="929" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">回写 + 通知</text>
</svg>
