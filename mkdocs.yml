site_name: ITSM
site_description: AI-Native IT Service Management — Tickets, Incidents, Problems, Changes, CMDB, Knowledge, BPMN, SLA, AI Triage
site_author: ITSM Contributors
repo_url: https://github.com/heidsoft/itsm
repo_name: heidsoft/itsm
edit_uri: edit/main/docs/
copyright: Copyright © 2024-present ITSM Contributors. Licensed under Apache 2.0.

docs_dir: docs

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 切换到浅色
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到系统主题
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/heidsoft/itsm
      name: GitHub
  generator: false

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search

nav:
  - 首页: index.md
  - 快速开始:
      - 安装: install.md
  - 架构:
      - 系统总览: architecture/overview.md
      - 部署优化: deployment-optimization.md
      - 生产部署清单: delivery/production-deployment-checklist.md
      - 生产数据初始化: delivery/production-initialization.md
      - 迁移回滚: delivery/rollback-guide.md
      - 开发命令: dev-commands-reference.md
      - 多租户部署与配置: multi-tenant/02-deployment-and-configuration.md
      - v1.0 GA 验收: v1-ga-readiness.md
  - 客户主数据:
      - 设计总览: customer-master-data/README.md
      - 主设计方案: customer-master-data/01-customer-master-data-design.md
      - DDL 与迁移: customer-master-data/02-ddl-and-migration.md
      - 待裁决问题: customer-master-data/03-open-questions.md
      - 多服务商场景: customer-master-data/04-multi-provider-scenario.md
      - 合同与项目闭环: customer-master-data/05-customer-contract-project-linkage.md
      - 合同建模与数据逻辑: customer-master-data/06-contract-modeling-design.md
      - 租户数据边界: customer-master-data/07-tenant-data-boundary.md
  - 治理:
      - 贡献指南: ../CONTRIBUTING.md
      - 标签体系: label-schema.md
      - Roadmap: roadmap.md
      - 覆盖审计: testing/coverage-audit.md
      - 文档规范: documentation-style-guide.md

extra_css:
  - stylesheets/extra.css

exclude_docs: |
  node_modules/
  tests/
  scripts/
  prd/
  plan/
  backups/
  testing/test-cases/
  archive/
  articles/
  ci/
  cmdb/
  delivery/
  images/
  migrations/
  product/
  rbac/
  review/
  tools/
  v1-ga/
  release/
