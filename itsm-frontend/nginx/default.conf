# Static-only server config for the ITSM SPA (Vite build output).
#
# Used by the `production` stage of itsm-frontend/Dockerfile and by
# Dockerfile.quick, and copied to /etc/nginx/conf.d/default.conf so it replaces
# the stock nginx config. It replaces the former Next.js runtime
# (`node server.js`): there is no server-side rendering, no BFF and no Node
# runtime here anymore — see docs/plan/vite-migration-plan.md §5.9 (方案 i).
#
# Port: kept at 3000 (the old Next.js standalone port) so that
# nginx/conf.d/default.conf ("location /" → http://itsm-frontend:3000) and the
# compose healthcheck keep working unchanged.

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Container health probe (compose healthcheck: GET /health).
    # Replaces the deleted Next.js route src/app/api/health/route.ts.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Vite emits content-hashed files under /assets/ — safe to cache forever.
    # NOTE: use add_header only (no `expires`) to avoid duplicate Cache-Control
    # response headers.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # index.html references the hashed assets above and must not be cached
    # long, otherwise clients keep loading an outdated bundle after a release.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Attachment previews. The shared ./uploads host directory is mounted
    # read-only at /usr/share/nginx/uploads (docker-compose.prod.yml); the URL
    # prefix /uploads/ must stay identical to the pre-migration setup.
    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        access_log off;
    }

    # SPA history fallback: every React Router path (and deep-link refresh) must
    # resolve to index.html instead of 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers are intentionally NOT set here: in production all browser
    # traffic enters through the main nginx container, which already adds them
    # (nginx/conf.d/default.conf). Duplicating them would emit the headers twice.
}
