database:
  host: postgres
  port: 5432
  user: dev
  password: "${DB_PASSWORD:}"
  dbname: itsm
  sslmode: disable

server:
  port: 8080
  mode: release
  jwt_secret: "${JWT_SECRET:}"
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"

redis:
  url: "redis://redis:6379"

# LLM 配置 —— token_cap 用作 LLMGateway 每次请求的 rune-token 上限（≈ 字符数 / 4）
# 未配置时代码走默认 4000（对 GPT-4-32k / GPT-4o 偏保守），生产建议 = 目标模型 context * 0.75
# 参考：GPT-3.5-16k → 3000-4000；GPT-4o-mini 128k → 8000；GPT-4-32k → 6000
llm:
  provider: "${LLM_PROVIDER:openai}"
  model: "${LLM_MODEL:gpt-4o-mini}"
  api_key: "${LLM_API_KEY:}"
  endpoint: "${LLM_ENDPOINT:}"
  token_cap: 8000

log:
  level: info

# 附件域灰度开关（方案 §6.1）：全部默认 false = 旧链路；灰度只改这里（部署级）
attachment:
  generic_read_enabled: false
  generic_write_enabled: false
  dual_write_enabled: false
  inline_image_enabled: false
  # BE-8 生命周期清理（部署级）：cleanup_enabled 开启后先以 dry-run 演练，
  # 核对清单后再开 cleanup_purge_enabled 落删。
  cleanup_enabled: false
  cleanup_purge_enabled: false
  retention_days: 30
  cleanup_interval_minutes: 360
  cleanup_batch_size: 200
