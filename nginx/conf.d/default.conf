# Docker 内嵌 DNS (127.0.0.11)。服务容器重建后 IP 会变化,
# 使用 resolver + 变量形式 proxy_pass 让 nginx 按服务名动态解析,
# 避免 upstream 块只在 nginx 启动时解析一次、指向旧 IP 导致 502。
resolver 127.0.0.11 valid=30s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Frontend routes
    # Upstream is the static SPA container (itsm-frontend = nginx:alpine serving
    # the Vite dist/ output on port 3000). SPA history fallback (try_files),
    # asset/index.html cache policy, /health and the /uploads/ alias live in
    # itsm-frontend/nginx/default.conf; /api/, WS and X-Forwarded-* below are
    # unchanged from the previous Next.js runtime.
    location / {
        set $frontend_upstream http://itsm-frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # API routes
    location /api/ {
        set $backend_upstream http://itsm-backend:8090;
        proxy_pass $backend_upstream;
        # $http_host（而非 $host）保留端口：后端 WebSocket 同源校验会比较
        # Origin 与完整 Host（含端口）；$host 去端口会让 http://host:8088 被判为不同源。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Preserve WebSocket upgrades for /api/v1/ws/notifications.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts for long-running API calls
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # Swagger docs
    location /swagger/ {
        set $backend_upstream http://itsm-backend:8090;
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check endpoint
    location /health {
        set $backend_health http://itsm-backend:8090/api/v1/health;
        proxy_pass $backend_health;
        access_log off;
    }
}
