# 演示环境入口 Nginx（itsm-nginx-demo → http://<host>:8089）
# 与主站 nginx/conf.d/default.conf 同构；仅上游容器名改为 *-demo
# （演示栈服务名带后缀，避免与主站服务名在同一网络上的 DNS 别名冲突）。
resolver 127.0.0.11 valid=30s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Frontend routes
    location / {
        set $frontend_upstream http://itsm-frontend-demo:3000;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # API routes
    location /api/ {
        set $backend_upstream http://itsm-backend-demo:8090;
        proxy_pass $backend_upstream;
        # $http_host（而非 $host）保留端口：后端 WebSocket 同源校验会比较
        # Origin 与完整 Host（含端口）。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Preserve WebSocket upgrades for /api/v1/ws/notifications.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # Swagger docs
    location /swagger/ {
        set $backend_upstream http://itsm-backend-demo:8090;
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check endpoint
    location /health {
        set $backend_health http://itsm-backend-demo:8090/api/v1/health;
        proxy_pass $backend_health;
        access_log off;
    }
}
